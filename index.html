<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To Do List</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --danger: #f87171;
    --ok: #34d399;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #312e81 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    background: rgba(30, 41, 59, 0.72);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 22px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
    padding: 28px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: 0.5px; }
  h1 span { color: var(--accent); }
  .date { color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 10px; margin: 22px 0 16px; }
  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    border-radius: var(--radius);
    border: 1px solid rgba(148, 163, 184, 0.25);
    background: var(--panel-2);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18); }
  input[type="text"]::placeholder { color: var(--muted); }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    transition: transform 0.08s, filter 0.15s, background 0.15s;
  }
  button:active { transform: scale(0.97); }
  .add-btn {
    padding: 0 22px;
    font-weight: 600;
    color: #05202e;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .add-btn:hover { filter: brightness(1.08); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .filters { display: flex; gap: 6px; background: var(--panel-2); padding: 4px; border-radius: 12px; }
  .filters button {
    padding: 7px 14px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    border-radius: 9px;
  }
  .filters button.active { background: rgba(56, 189, 248, 0.16); color: var(--accent); font-weight: 600; }
  .clear-btn { background: transparent; color: var(--muted); font-size: 13px; padding: 7px 10px; }
  .clear-btn:hover { color: var(--danger); }
  ul { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    background: var(--panel-2);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: var(--radius);
    animation: pop 0.18s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .check {
    width: 22px; height: 22px; flex: 0 0 22px;
    border-radius: 50%;
    border: 2px solid rgba(148, 163, 184, 0.5);
    background: transparent;
    display: grid; place-items: center;
    padding: 0;
  }
  .check:hover { border-color: var(--ok); }
  li.done .check { background: var(--ok); border-color: var(--ok); }
  .check svg { width: 12px; height: 12px; opacity: 0; }
  li.done .check svg { opacity: 1; }
  .label { flex: 1; font-size: 15px; line-height: 1.4; word-break: break-word; cursor: text; }
  li.done .label { color: var(--muted); text-decoration: line-through; }
  .label input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    padding: 4px 8px;
    outline: none;
  }
  .del {
    width: 30px; height: 30px; flex: 0 0 30px;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    border-radius: 8px;
    opacity: 0;
  }
  li:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--danger); background: rgba(248, 113, 113, 0.12); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0 24px; font-size: 14px; }
  .empty .big { font-size: 38px; display: block; margin-bottom: 10px; }
  .status { color: var(--muted); font-size: 13px; margin-top: 18px; display: flex; justify-content: space-between; }
  @media (max-width: 520px) {
    body { padding: 20px 10px; }
    .app { padding: 20px; border-radius: 18px; }
    .add-btn { padding: 0 16px; }
    .date { display: none; }
  }
</style>
</head>
<body>
  <main class="app">
    <header>
      <h1>To Do <span>List</span></h1>
      <div class="date" id="date"></div>
    </header>

    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="What needs to be done?" maxlength="200" aria-label="New task" />
      <button class="add-btn" type="submit">Add</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="done">Done</button>
      </div>
      <button type="button" class="clear-btn" id="clear">Clear completed</button>
    </div>

    <ul id="list"></ul>

    <div class="status">
      <span id="remaining">0 tasks left</span>
      <span id="total">0 total</span>
    </div>
  </main>

<script>
  const STORAGE_KEY = "todo-app.tasks.v1";
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const list = document.getElementById("list");
  const remainingEl = document.getElementById("remaining");
  const totalEl = document.getElementById("total");
  const clearBtn = document.getElementById("clear");
  const dateEl = document.getElementById("date");
  const filterButtons = document.querySelectorAll("[data-filter]");

  let tasks = load();
  let filter = "all";

  dateEl.textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "short", day: "numeric"
  });

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function addTask(text) {
    const value = text.trim();
    if (!value) return;
    tasks.unshift({ id: uid(), text: value, done: false, createdAt: Date.now() });
    save();
    render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function editTask(id, newText) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const value = newText.trim();
    if (value) t.text = value;
    save();
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function visibleTasks() {
    if (filter === "active") return tasks.filter(t => !t.done);
    if (filter === "done") return tasks.filter(t => t.done);
    return tasks;
  }

  function startEditing(li, task) {
    const label = li.querySelector(".label");
    const editor = document.createElement("input");
    editor.type = "text";
    editor.value = task.text;
    editor.maxLength = 200;
    label.replaceWith(editor);
    editor.focus();
    editor.setSelectionRange(editor.value.length, editor.value.length);

    let finished = false;
    const commit = () => {
      if (finished) return;
      finished = true;
      editTask(task.id, editor.value);
    };
    editor.addEventListener("blur", commit);
    editor.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      if (e.key === "Escape") { finished = true; render(); }
    });
  }

  function render() {
    const items = visibleTasks();
    list.innerHTML = "";

    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.style.background = "transparent";
      empty.style.border = "none";
      empty.style.display = "block";
      const message = filter === "done" ? "Nothing completed yet."
        : filter === "active" ? "All caught up. Nice!"
        : "No tasks yet. Add one above.";
      empty.textContent = message;
      list.appendChild(empty);
    }

    for (const task of items) {
      const li = document.createElement("li");
      li.className = task.done ? "done" : "";
      li.dataset.id = task.id;

      const check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.done ? "Mark as not done" : "Mark as done");
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#05202e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      check.addEventListener("click", () => toggleTask(task.id));

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = task.text;
      label.title = "Click to edit";
      label.addEventListener("click", () => startEditing(li, task));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.setAttribute("aria-label", "Delete task");
      del.textContent = "×";
      del.addEventListener("click", () => deleteTask(task.id));

      li.append(check, label, del);
      list.appendChild(li);
    }

    const left = tasks.filter(t => !t.done).length;
    remainingEl.textContent = `${left} task${left === 1 ? "" : "s"} left`;
    totalEl.textContent = `${tasks.length} total`;
    clearBtn.style.visibility = tasks.some(t => t.done) ? "visible" : "hidden";

    filterButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.filter === filter));
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    addTask(input.value);
    input.value = "";
    input.focus();
  });

  clearBtn.addEventListener("click", clearCompleted);

  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>
</body>
</html>
